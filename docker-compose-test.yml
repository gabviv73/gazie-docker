services:

  gazie-app:
    #build:
    #  context: .
    image: gabrieleviv/gazie-docker:9.10
    container_name: gazie-app
    restart: no
    ports:
      - 8971:80
    environment:
      - MARIADB_ROOT_PASSWORD=gazieRootPassword
      - MARIADB_DATABASE=gazie
      - MARIADB_USER=gazie
      - MARIADB_PASSWORD=gaziePassword
    volumes:
      - ./data:/var/www/html/data
      - ./php.ini-development:/usr/local/etc/php/php.ini
      - ./phpinfo.php:/var/www/html/phpinfo.php
    depends_on:
      gazie-db:
        condition: service_healthy

  gazie-db:
    image: mariadb:11.4.5
    container_name: gazie-db
    restart: no
    environment:
      - MARIADB_ROOT_PASSWORD=gazieRootPassword
      - MARIADB_DATABASE=gazie
      - MARIADB_USER=gazie
      - MARIADB_PASSWORD=gaziePassword
      - TZ=Europe/Rome
    ports:
      - 3306:3306
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3
     
